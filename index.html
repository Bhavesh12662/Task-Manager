<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Task Manager</title>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-2xl mx-auto px-6 py-6">
            <h1 class="text-3xl font-bold text-center text-gray-900">
                Task Manager
            </h1>

            <p class="text-center text-gray-500 mt-2">
                Manage your daily tasks
            </p>
        </div>
    </header>


    <!-- Main -->
    <main class="max-w-2xl mx-auto px-6 py-8">

        <!-- Add Task -->
        <div class="bg-white p-5 rounded-xl shadow-sm">

            <div class="flex flex-col sm:flex-row gap-3">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task..."
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
                >

                <button
                    id="addTaskBtn"
                    class="px-6 py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700"
                >
                    Add Task
                </button>

            </div>

        </div>


        <!-- Statistics -->
        <div class="grid grid-cols-3 gap-3 mt-6">

            <!-- Total -->
            <div class="bg-white p-4 rounded-xl shadow-sm text-center">

                <h2
                    id="totalTasks"
                    class="text-2xl font-bold text-gray-900"
                >
                    0
                </h2>

                <p class="text-gray-500 text-sm">
                    Total
                </p>

            </div>


            <!-- Pending -->
            <div class="bg-white p-4 rounded-xl shadow-sm text-center">

                <h2
                    id="pendingTasks"
                    class="text-2xl font-bold text-orange-500"
                >
                    0
                </h2>

                <p class="text-gray-500 text-sm">
                    Pending
                </p>

            </div>


            <!-- Completed -->
            <div class="bg-white p-4 rounded-xl shadow-sm text-center">

                <h2
                    id="completedTasks"
                    class="text-2xl font-bold text-green-600"
                >
                    0
                </h2>

                <p class="text-gray-500 text-sm">
                    Completed
                </p>

            </div>

        </div>


        <!-- Task List -->
        <div class="mt-6">

            <ul
                id="taskList"
                class="space-y-3"
            >
            </ul>

        </div>


        <!-- Clear All -->
        <button
            id="clearAllBtn"
            class="w-full mt-6 py-3 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700"
        >
            Clear All Tasks
        </button>

    </main>


    <script src="script.js"></script>

</body>

</html>
